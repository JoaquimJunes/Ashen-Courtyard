name: Validate game and Linux release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Install checksum-pinned Godot 4.6.2 and Linux templates
        run: python3 tools/install_toolchain.py
      - name: Import, test, export, and smoke-test
        run: python3 tools/check_project.py --release --jobs 2
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-results
          path: .artifacts/ci/
          if-no-files-found: warn
      - name: Upload tested Linux build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ashen-courtyard-linux
          path: |
            .artifacts/build/*.tar.gz
            .artifacts/build/SHA256SUMS
          if-no-files-found: error
